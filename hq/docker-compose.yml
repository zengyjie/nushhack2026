# MESH HQ: PostgreSQL + the HQ server (API and web app), plus an optional Cloudflare quick tunnel.
#   docker compose up -d --build                  # HQ on http://<this machine>:8000
#   docker compose --profile tunnel up -d         # also expose it at a public https://*.trycloudflare.com URL
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mesh
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesh-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d mesh"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hq:
    build: .
    environment:
      DATABASE_URL: postgresql://mesh:${POSTGRES_PASSWORD:-mesh-local}@db:5432/mesh
      HQ_ADMIN_TOKEN: ${HQ_ADMIN_TOKEN:?Set HQ_ADMIN_TOKEN in .env (copy .env.example)}
      HQ_SEED_HEX: ${HQ_SEED_HEX:-}
      CONFLICT_WINDOW_MIN: ${CONFLICT_WINDOW_MIN:-10}
      VENUE_WINDOW_H: ${VENUE_WINDOW_H:-12}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HQ_PORT:-8000}:8000"
    restart: unless-stopped

  tunnel:
    # Quick tunnel: no Cloudflare account needed. The URL changes each time this container restarts.
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://hq:8000
    depends_on:
      - hq
    profiles: ["tunnel"]
    restart: unless-stopped

volumes:
  pgdata:
