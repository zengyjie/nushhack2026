<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MESH HQ</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="side">
    <a class="brand" href="#/overview">
      <span class="wordmark">M<img src="/static/mark.svg" alt="">SH</span>
      <span class="brand-sub">HQ</span>
    </a>
    <nav>
      <a href="#/overview" data-nav="overview"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Overview</a>
      <a href="#/patients" data-nav="patients"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>Patients</a>
      <a href="#/conflicts" data-nav="conflicts"><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>Conflicts<span class="badge" id="nav-conflicts" hidden></span></a>
      <a href="#/broadcast" data-nav="broadcast"><svg viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.6c1 .7 2.2 1.6 3.2 2.4l.8-1.1c-1-.7-2.2-1.6-3.2-2.4L16 17.6zM20 5.1 19.2 4c-1 .8-2.2 1.6-3.2 2.4l.8 1.1c1-.8 2.2-1.6 3.2-2.4zM4 9a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1v4h2v-4h1l5 3V6L8 9H4z"/></svg>Broadcast</a>
      <a href="#/inventory" data-nav="inventory"><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v3c0 .7.4 1.4 1 1.7V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.7c.6-.3 1-1 1-1.7V4a2 2 0 0 0-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/></svg>Inventory<span class="badge" id="nav-requests" hidden></span></a>
    </nav>
    <div class="side-foot">
      <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></div>
      <div class="auditor" id="auditor-name"></div>
      <button class="link" id="logout">Sign out</button>
    </div>
  </aside>

  <main id="view" aria-live="polite"></main>

  <div class="modal-back" id="login" hidden>
    <form class="modal" id="login-form">
      <div class="login-brand"><span class="wordmark big">M<img src="/static/mark.svg" alt="">SH</span><span class="brand-sub">HQ</span></div>
      <p class="muted">Sign in to the HQ console. Your name is recorded on every audit decision.</p>
      <label>Your name<input name="auditor" required autocomplete="name" placeholder="Rank and name"></label>
      <label>Admin token<input name="token" type="password" required autocomplete="current-password"></label>
      <p class="error" id="login-error" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>

  <div class="modal-back" id="dialog" hidden><form class="modal" id="dialog-form"></form></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
